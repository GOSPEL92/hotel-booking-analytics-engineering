models:

  - name: dim_country
    columns:

      - name: country
        tests:
          - not_null
          - unique

  - name: dim_customer_type
    columns:

      - name: customer_type
        tests:
          - not_null
          - unique

  - name: dim_hotel
    columns:

      - name: hotel
        tests:
          - not_null
          - unique

  - name: dim_market_segment
    columns:

      - name: market_segment
        tests:
          - not_null

  - name: dim_date
    description: "Conformed calendar date dimension supporting time-series booking analytics."
    columns:
      - name: date_day
        description: "Primary key representing each calendar date."
        tests:
          - unique
          - not_null
      - name: year_number
        description: "Calendar year (e.g., 2015, 2016, 2017)."
        tests:
          - not_null
      - name: is_weekend
        description: "Boolean flag indicating whether the date falls on a Saturday or Sunday."

  - name: fct_bookings
    columns:

      - name: booking_status
        tests:
          - not_null

          - accepted_values:
              arguments:
                values:
                  - Completed
                  - Cancelled

      - name: hotel
        tests:
          - not_null

          - relationships:
              arguments:
                to: ref('dim_hotel')
                field: hotel

      - name: country
        tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country
              config:
                where: "country is not null"

      - name: customer_type
        tests:
          - not_null

          - relationships:
              arguments:
                to: ref('dim_customer_type')
                field: customer_type

      - name: market_segment
        tests:
          - not_null

          - relationships:
              arguments:
                to: ref('dim_market_segment')
                field: market_segment